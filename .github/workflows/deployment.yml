name: CI and deploy

on:
    push:
        branches: ["main"]
        paths:
          - '.dockerignore'
          - '.nvmrc'
          - '.github/workflows/deployment.yml'
          - 'package.json'
          - 'package-lock.json'
          - 'tsconfig.json'
          - 'app/**'
          - 'server/**'
          - 'packages/shared-types/**'
          - 'scripts/**'
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    run-tests:
        name: Run unit tests and e2e
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Install actionlint
              run: |
                  curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
                  echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
                  tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
            - name: Validate GitHub Actions workflows
              run: /tmp/actionlint -color
            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
            - run: test "$(npm --version)" = "11.20.0"
            - run: npm ci
            - run: npm run build:shared-types
            - run: npm run lint --prefix app
            - run: npm run lint --prefix server
            - name: Build production client
              run: npm run build:prod --prefix app
              env:
                  VITE_API_BASE_URL: https://example.invalid/api
                  VITE_APP_BASE_PATH: /tv-app
                  VITE_ENABLE_API_MOCK: "false"
            - run: npm run build --prefix server
            - run: npm run test:client
            - run: npm run test:server
            - run: npm run test:client:cy

    publish-demo:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: run-tests
        name: Build and publish GitHub Pages demo
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
            - run: test "$(npm --version)" = "11.20.0"
            - run: npm ci
            - run: npm run build:shared-types
            - name: Build frontend for Render API
              run: npm run build:prod --prefix app
              env:
                  VITE_API_BASE_URL: https://tv-app-nodejs-latest.onrender.com/api
                  VITE_APP_BASE_PATH: /tv-app
                  VITE_ENABLE_API_MOCK: "false"

            - name: Checkout demo branch
              uses: actions/checkout@v7
              with:
                  ref: demo
                  path: demo

            - name: Publish frontend build to demo branch
              run: |
                  rsync -a --delete --exclude='.git/' app/dist/ demo/
                  git -C demo config user.name "github-actions[bot]"
                  git -C demo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git -C demo add --all
                  if git -C demo diff --cached --quiet; then
                    echo "Demo build is unchanged"
                    exit 0
                  fi
                  git -C demo commit -m "Deploy frontend from ${GITHUB_SHA}"
                  git -C demo push origin HEAD:demo

    dockerize-build-and-push:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: run-tests
        name: Build and push backend image
        runs-on: ubuntu-latest
        env:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_NAME: tv-app_nodejs

        steps:
            - uses: actions/checkout@v7
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build and push backend image
              run: |
                  docker build \
                    --file server/Dockerfile.prod \
                    --tag "$DOCKERHUB_USERNAME/$IMAGE_NAME:$GITHUB_SHA" \
                    .
                  docker push "$DOCKERHUB_USERNAME/$IMAGE_NAME:$GITHUB_SHA"
