name: CI - Run tests dockerize and push to Docker Hub

on:
    push:
        branches: ["master"]
        paths:
          - '.dockerignore'
          - '.nvmrc'
          - '.github/workflows/deployment.yml'
          - 'package.json'
          - 'package-lock.json'
          - 'tsconfig.json'
          - 'docker-compose*.yml'
          - 'app/**'
          - 'server/**'
          - 'packages/shared-types/**'
          - 'scripts/**'
    pull_request:
        branches: ["master"]
        paths:
          - '.dockerignore'
          - '.nvmrc'
          - '.github/workflows/deployment.yml'
          - 'package.json'
          - 'package-lock.json'
          - 'tsconfig.json'
          - 'docker-compose*.yml'
          - 'app/**'
          - 'server/**'
          - 'packages/shared-types/**'
          - 'scripts/**'

jobs:
    run-tests:
        name: Run unit tests and e2e
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3
            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
            - run: test "$(npm --version)" = "11.11.1"
            - run: npm ci
            - run: npm run build:shared-types
            - run: npm run test:client
            - run: npm run test:server
            - run: npm run test:client:cy

    dockerize-build-and-push:
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        needs: run-tests

        name: Dockerize application
        runs-on: ubuntu-latest
        env:
            docker-images: "tv-app_react-webapp,tv-app_nodejs"

        steps:
            - uses: actions/checkout@v3
            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
            - run: test "$(npm --version)" = "11.11.1"

            - name: Create .env file
              env:
                  TV_APP_PROD_ENV: ${{ secrets.TV_APP_PROD_ENV }}
              run: |
                  printf '%s' "$TV_APP_PROD_ENV" > .env

            - name: Dockerize services
              run: docker compose -f "docker-compose.prod.yml" up -d --build

            - name: Stop services
              if: always()
              run: docker compose -f "docker-compose.prod.yml" down

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Push to Docker Hub
              run: |
                  IFS=',' read -r -a images <<< "${{ env.docker-images }}"
                  for image in ${images[@]}
                  do
                    docker tag $image ${{ secrets.DOCKERHUB_USERNAME }}/$image:${{ github.sha }}
                    docker push ${{ secrets.DOCKERHUB_USERNAME }}/$image:${{ github.sha }}
                  done
